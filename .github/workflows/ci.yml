name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build & offline unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true

      - name: Show toolchain
        run: swift --version

      - name: Build VokabKit
        run: swift build

      # Offline unit tests only. Real-agy integration tests are gated by
      # VOKAB_AGY_INTEGRATION and require the agy CLI + auth, so they are not
      # run in CI.
      - name: Run offline unit tests
        run: swift test --filter VokabKitTests

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Build app (ad-hoc, no signing)
        run: |
          cd App
          xcodebuild -project vokab.xcodeproj -scheme vokab \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
