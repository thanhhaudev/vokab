<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2F7" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#4F35D4" />
    </linearGradient>
  </defs>

  <g filter="url(#baseShadow)">
    <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#baseGrad)" />
  </g>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8" />

  <g transform="translate(256, 256) rotate(-8) translate(-256, -256)" filter="url(#cardShadow)">
    <rect x="136" y="106" width="240" height="300" rx="24" fill="url(#primaryGrad)" />
  </g>

  <g transform="translate(256, 256) rotate(4) translate(-256, -256)">
    <g filter="url(#cardShadow)">
      <rect x="136" y="106" width="240" height="300" rx="24" fill="#FFFFFF" />
    </g>
    <rect x="136" y="106" width="240" height="300" rx="24" fill="none" stroke="#F0F0F5" stroke-width="2" />

    <path d="M 182 166 L 256 256 L 330 166" fill="none" stroke="url(#primaryGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="180" y="310" width="152" height="16" rx="8" fill="#E5E5EA" />
    <rect x="180" y="342" width="96" height="16" rx="8" fill="#E5E5EA" />
    
    <circle cx="296" cy="350" r="8" fill="#34C759" />
  </g>
</svg>
